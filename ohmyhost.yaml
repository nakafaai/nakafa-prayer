version: 1
project: nakafa-prayer-website
# The macOS app lives at the repository root; the hosted web app is the
# `website` workspace, so the build runs against that directory.
applicationRoot: website
build:
  install: pnpm install --frozen-lockfile --ignore-scripts
  command: pnpm run build
  output: dist
runtime:
  mode: static
database:
  enabled: false
auth:
  provider: none
mail:
  enabled: false
